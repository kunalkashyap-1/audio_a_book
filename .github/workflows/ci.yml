name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies (dev extras only; no model download)
        run: |
          uv venv
          uv pip install -e "python[dev]"

      - name: Install web dependencies
        run: npm ci

      - name: Tests
        run: .venv/bin/python -m pytest python/tests -q

      - name: HTTP smoke (fake provider)
        run: ./scripts/smoke.sh

      - name: Generated contracts are current
        run: |
          ./scripts/generate_contracts.sh
          git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/api.d.ts

      - name: Web typecheck
        run: npm run typecheck

      - name: Web build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for API and web
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null \
               && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose down -v
